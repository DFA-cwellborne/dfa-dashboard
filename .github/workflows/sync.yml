name: Sync chapter data

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run sync:run
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_SHEET_NAME: ${{ secrets.GOOGLE_SHEETS_SHEET_NAME }}
          GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_SIGNUPS_BASE_ID: ${{ secrets.AIRTABLE_SIGNUPS_BASE_ID }}
          AIRTABLE_SIGNUPS_TABLE: ${{ secrets.AIRTABLE_SIGNUPS_TABLE }}
          AIRTABLE_EVENTS_BASE_ID: ${{ secrets.AIRTABLE_EVENTS_BASE_ID }}
          AIRTABLE_EVENTS_TABLE: ${{ secrets.AIRTABLE_EVENTS_TABLE }}
          BREAKTHRU_API_BASE_URL: ${{ secrets.BREAKTHRU_API_BASE_URL }}
          BREAKTHRU_API_KEY: ${{ secrets.BREAKTHRU_API_KEY }}
          USE_MOCK_DATA: "false"
